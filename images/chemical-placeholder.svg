<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f1e8"/>
      <stop offset="100%" stop-color="#ebe2d3"/>
    </linearGradient>
    <linearGradient id="flask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4a38"/>
      <stop offset="100%" stop-color="#143528"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" fill="url(#bg)"/>
  
  <!-- Subtle circular backdrop -->
  <circle cx="300" cy="190" r="105" fill="#e2d6c3" opacity="0.45"/>
  <circle cx="300" cy="190" r="85" fill="#fcf9f5" opacity="0.6"/>

  <!-- Chemical Flask Graphic -->
  <g transform="translate(300, 190) scale(1.15)">
    <!-- Flask Neck & Rim -->
    <rect x="-18" y="-72" width="36" height="6" rx="3" fill="#1d4a38"/>
    <path d="M -12 -66 L -12 -25 L -48 42 A 8 8 0 0 0 -41 52 L 41 52 A 8 8 0 0 0 48 42 L 12 -25 L 12 -66 Z" fill="none" stroke="#1d4a38" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Liquid inside Flask -->
    <path d="M -36 24 Q -18 16 0 24 T 36 24 L 40 45 A 6 6 0 0 1 34 50 L -34 50 A 6 6 0 0 1 -40 45 Z" fill="#c45c26" opacity="0.88"/>
    
    <!-- Bubble details -->
    <circle cx="-10" cy="36" r="3.5" fill="#fff" opacity="0.6"/>
    <circle cx="12" cy="30" r="2.5" fill="#fff" opacity="0.6"/>
    <circle cx="2" cy="12" r="2.5" fill="#c45c26" opacity="0.5"/>
    <circle cx="-6" cy="-2" r="1.8" fill="#c45c26" opacity="0.5"/>

    <!-- Measurement markings -->
    <line x1="-16" y1="2" x2="-8" y2="2" stroke="#1d4a38" stroke-width="2" opacity="0.6"/>
    <line x1="-24" y1="18" x2="-14" y2="18" stroke="#1d4a38" stroke-width="2" opacity="0.6"/>
    <line x1="-32" y1="34" x2="-22" y2="34" stroke="#1d4a38" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Brand / Placeholder Text -->
  <text x="300" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="20" font-weight="700" fill="#13261c" letter-spacing="-0.6">Photo available on request</text>
  <text x="300" y="352" text-anchor="middle" font-family="'Albert Sans', 'Avenir Next', sans-serif" font-size="13" font-weight="600" fill="#5e564b" letter-spacing="0.2">Salman Traders · Lahore since 1974</text>
</svg>

