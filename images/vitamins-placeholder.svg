<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f1e8"/>
      <stop offset="100%" stop-color="#ebe2d3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Capsule 1 - amber/orange -->
  <rect x="160" y="130" width="52" height="120" rx="26" fill="#C96A32" opacity="0.85"/>
  <rect x="160" y="130" width="52" height="60" rx="26" fill="#e8a060" opacity="0.9"/>
  <!-- Capsule 2 - green -->
  <rect x="240" y="110" width="52" height="120" rx="26" fill="#2d6e3f" opacity="0.8"/>
  <rect x="240" y="110" width="52" height="60" rx="26" fill="#5aaa6d" opacity="0.85"/>
  <!-- Capsule 3 - gold -->
  <rect x="320" y="140" width="52" height="120" rx="26" fill="#b8860b" opacity="0.8"/>
  <rect x="320" y="140" width="52" height="60" rx="26" fill="#daa520" opacity="0.85"/>
  <!-- Round tablet -->
  <circle cx="420" cy="190" r="30" fill="#18281E" opacity="0.15"/>
  <circle cx="420" cy="190" r="26" fill="#f0ebe0" stroke="#c5b89a" stroke-width="1.5"/>
  <text x="420" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#18281E" opacity="0.5">V</text>
  <!-- Label -->
  <text x="300" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="22" font-weight="700" fill="#18281E" opacity="0.65">Vitamins &amp; Supplements</text>
  <text x="300" y="350" text-anchor="middle" font-family="'Albert Sans',Arial,sans-serif" font-size="14" fill="#5c564c" opacity="0.7">Multiple grades available</text>
</svg>
